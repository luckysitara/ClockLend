name = "clocklend-oracle-keeper"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Scheduled Cron Trigger
# Runs every 3 minutes. The on-chain program caps admin-feed pricing at 600s
# (ADMIN_FEED_MAX_PRICE_AGE_SECS in program/src/processor.rs), so this gives a
# 2x safety margin against the fail-closed staleness bound.
[triggers]
crons = ["*/3 * * * *"]

[vars]
PROGRAM_ID = "4Dp2A6SHQHEpuoMT4GuzZnnpLcDYrJnpELm1UjuNHgv7"
NETWORK = "mainnet-beta"
PRIORITY_FEE_MICRO_LAMPORTS = "25000"

# ---------------------------------------------------------------------------
# RPC_URL is deliberately NOT in [vars].
#
# [vars] is committed in plaintext, so an RPC endpoint carrying an API key
# belongs in a Cloudflare secret instead. The worker reads RPC_URL from the
# environment exactly as before — it just is not checked in any more:
#
#   npx wrangler secret put RPC_URL
#   # paste your provider endpoint when prompted, e.g.
#   # https://mainnet.helius-rpc.com/?api-key=<YOUR_KEY>
#
# DO NOT paste the key into this file. A Helius mainnet key was previously
# committed here (in [vars] and later in this comment) and remains in git
# history. It is still valid until rotated with the provider — deleting the
# text does NOT revoke it. Rotate the key in the Helius dashboard.
#
# If RPC_URL is unset the worker falls back to the public endpoint
# https://api.mainnet-beta.solana.com (rate-limited — fine for smoke tests,
# not for a 3-minute production cron).
# ---------------------------------------------------------------------------

# Secrets to set via `npx wrangler secret put <NAME>`:
#
# REQUIRED
# - ORACLE_KEYPAIR    Base58 string or JSON array [1,2,3...] of the oracle
#                     authority keypair (the `oracle_authority` recorded in the
#                     AdminConfig PDA).
# - CRANK_AUTH_TOKEN  Bearer token required by POST /crank. The endpoint FAILS
#                     CLOSED: with this unset, /crank returns 503 and no crank
#                     runs, so an unauthenticated deploy can never be griefed
#                     into spending the oracle authority's lamports.
#
# OPTIONAL
# - RPC_URL           Mainnet RPC endpoint (see note above).
# - JUPITER_API_KEY   Jupiter Price API v3 key, for higher rate limits.
