name = "clocklend-oracle-keeper"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Scheduled Cron Trigger
# Runs every 3 minutes (ClockLend smart contracts enforce a 600s / 10-minute staleness bound)
[triggers]
crons = ["*/3 * * * *"]

[vars]
PROGRAM_ID = "HAjGxuih14imCMaWvCnJQ3nSdWmS8PQKzp74gyAgjsH3"
RPC_URL = "https://api.devnet.solana.com"
NETWORK = "devnet"
PRIORITY_FEE_MICRO_LAMPORTS = "25000"

# Secrets to set via `npx wrangler secret put`:
# - ORACLE_KEYPAIR: Base58 string or JSON array [1,2,3...] of the oracle authority keypair
# - JUPITER_API_KEY: (Optional) Jupiter v3 API key for higher rate limits
# - CRANK_AUTH_TOKEN: (Optional) Secret bearer token to protect manual POST /crank endpoint
