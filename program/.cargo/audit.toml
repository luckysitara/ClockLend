# cargo-audit configuration.
#
# Every advisory below is DEV-ONLY: verified against the on-chain build with
#   cargo tree -e normal --target bpfel-unknown-none
# None of these crates appear in clock_lend.so. The three crates that DO ship
# in the binary (libsecp256k1, rand 0.7.x, bincode 1.3.x) are inert transitives
# of solana-program with no upstream fix — they are tracked here as known
# accepted risk, not ignored noise.
#
# Re-run the verification after any dependency bump:
#   cargo tree -e normal --target bpfel-unknown-none | grep -E "libsecp256k1|rand |bincode"

[advisories]
ignore = [
  # Dev-only (solana-program-test / solana-sdk):
  "RUSTSEC-2022-0093", # ed25519-dalek 1.0.1 double-public-key signing oracle
  "RUSTSEC-2024-0344", # curve25519-dalek 3.2.0 timing variability
  "RUSTSEC-2026-0098", # rustls-webpki
  "RUSTSEC-2026-0099", # rustls-webpki
  "RUSTSEC-2026-0104", # rustls-webpki
  "RUSTSEC-2026-0251", # sized-chunks
  "RUSTSEC-2026-0253", # lru 0.7.8 pop() panic safety (dev-only path)
  "RUSTSEC-2024-0388", # derivative unmaintained (build-time proc macro)
  "RUSTSEC-2024-0436", # paste unmaintained (build-time proc macro)
  "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained (build-time)
  "RUSTSEC-2025-0119", # number_prefix unmaintained (dev-only)
  "RUSTSEC-2024-0375", # atty (dev-only terminal detection)
  "RUSTSEC-2023-0126", # im (dev-only)
  "RUSTSEC-2026-0248", # im (dev-only)
  "RUSTSEC-2023-0033", # borsh ZST parsing — no ZST fields in program structs
  "RUSTSEC-2026-0247", # bitmaps unmaintained (dev-only)
  # Ships in clock_lend.so but inert (no fix available upstream; see header):
  "RUSTSEC-2025-0161", # libsecp256k1 unmaintained
  "RUSTSEC-2026-0097", # rand 0.7.3 unsound with custom logger (never used)
  "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained
]
