# ClockLend secondary price keeper (Failover / Backup)
# Runs on GitHub Actions (Azure infrastructure) to back up Cloudflare Workers.
name: ClockLend Keeper Backup

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch: {}

jobs:
  crank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm --prefix serverless ci
      - name: Run keeper (devnet)
        env:
          ORACLE_KEYPAIR: ${{ secrets.KEEPER_KEYPAIR_JSON }}
          RPC_URL: https://api.devnet.solana.com
          NETWORK: devnet
        run: node serverless/src/cli.mjs

